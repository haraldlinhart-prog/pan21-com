<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Präsenz-Schalter</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; padding: 24px;
    background: #0b0d12; color: #f0f2f5; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
  }
  h1 { font-size: 1.1rem; font-weight: 600; color: #9aa3b2; margin: 0 0 8px; }
  #status { font-size: 1rem; color: #6b7484; margin-bottom: 12px; min-height: 1.4em; }
  .btn {
    width: 100%; max-width: 340px; padding: 26px 20px; font-size: 1.3rem; font-weight: 700;
    border: none; border-radius: 16px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #onBtn { background: #1f9d55; color: #fff; }
  #offBtn { background: #2a2f3a; color: #f0f2f5; }
  #pwWrap { display: none; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }
  #pwWrap input {
    padding: 14px; border-radius: 10px; border: 1px solid #333; background: #171a21; color: #fff; font-size: 1rem;
  }
  #pwWrap button { padding: 14px; border-radius: 10px; border: none; background: #3a6ff7; color: #fff; font-size: 1rem; font-weight: 600; }
  .msg { font-size: 0.85rem; color: #6b7484; margin-top: 8px; }
</style>
</head>
<body>
  <h1>PAN21 Bestell-Zentrale</h1>
  <div id="status">Lade Status…</div>

  <button class="btn" id="onBtn">Bin da 🟢</button>
  <button class="btn" id="offBtn">Bin weg ⚫</button>

  <div id="pwWrap">
    <input type="password" id="pw" placeholder="Passwort" autocomplete="current-password">
    <button id="pwSubmit">Bestätigen</button>
  </div>
  <div class="msg" id="msg"></div>

<script>
  const statusEl = document.getElementById('status');
  const msgEl = document.getElementById('msg');
  const pwWrap = document.getElementById('pwWrap');
  const pwInput = document.getElementById('pw');
  let pendingState = null;

  // Passwort wird NICHT dauerhaft gespeichert (kein localStorage) - nur
  // fuer die Dauer der Session im Speicher, damit man es nicht bei jedem
  // Klick neu eintippen muss.
  let sessionSecret = null;

  async function loadStatus() {
    try {
      const r = await fetch('/api/presence', { cache: 'no-store' });
      const d = await r.json();
      statusEl.textContent = d.at_desk
        ? '🟢 Aktuell: Am Schreibtisch'
        : '⚫ Aktuell: Nicht am Schreibtisch';
    } catch {
      statusEl.textContent = 'Status konnte nicht geladen werden';
    }
  }

  function askPasswordThenSend(atDesk) {
    pendingState = atDesk;
    if (sessionSecret) {
      send(atDesk, sessionSecret);
      return;
    }
    pwWrap.style.display = 'flex';
    pwInput.focus();
  }

  async function send(atDesk, secret) {
    msgEl.textContent = 'Wird gespeichert…';
    try {
      const r = await fetch('/api/presence', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ at_desk: atDesk, secret }),
      });
      if (r.status === 401) {
        msgEl.textContent = 'Falsches Passwort.';
        sessionSecret = null;
        pwWrap.style.display = 'flex';
        return;
      }
      if (!r.ok) throw new Error();
      sessionSecret = secret;
      pwWrap.style.display = 'none';
      pwInput.value = '';
      msgEl.textContent = 'Gespeichert.';
      await loadStatus();
    } catch {
      msgEl.textContent = 'Fehler beim Speichern, bitte nochmal versuchen.';
    }
  }

  document.getElementById('onBtn').addEventListener('click', () => askPasswordThenSend(true));
  document.getElementById('offBtn').addEventListener('click', () => askPasswordThenSend(false));
  document.getElementById('pwSubmit').addEventListener('click', () => {
    if (pendingState === null) return;
    send(pendingState, pwInput.value);
  });
  pwInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('pwSubmit').click();
  });

  loadStatus();
</script>
</body>
</html>
